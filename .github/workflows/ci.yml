name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: mbstring

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Validate composer.json
        run: composer validate

      - name: Run tests
        run: vendor/bin/phpunit

  content:
    # Every page in the docs manifest must render.
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: luany-ecosystem/docs
          path: content

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: mbstring

      - run: composer install --no-interaction --prefer-dist

      - name: Render every page
        run: php bin/check-content.php
